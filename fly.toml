# Fly.io deployment. Provision the managed dependencies first:
#
#   fly postgres create --name marketpulse-db
#   fly redis create
#   fly launch --no-deploy
#   fly postgres attach marketpulse-db
#   fly secrets set ANTHROPIC_API_KEY=sk-ant-...
#   fly secrets set DATABASE_URL_RO="$(fly secrets list | ...)"   # same DSN, RO role
#   fly deploy
#
# The ingestion worker runs as a separate process group so it scales
# independently of the HTTP process (and stays at exactly one instance).

app = "marketpulse"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  LOG_LEVEL = "INFO"
  SYMBOLS = "BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT"

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "python -m app.ingest.worker"

[http_service]
  internal_port = 8000
  force_https = true
  processes = ["app"]
  # The API must stay warm: scaling to zero would drop every dashboard
  # WebSocket and make the first request after an idle period very slow.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health/live"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]

[deploy]
  release_command = "python scripts/migrate.py"
