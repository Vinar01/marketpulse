global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: marketpulse-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: {component: api}

  # The worker exposes its own registry on 9101. Scraping it separately is what
  # makes ingestion lag and queue depth visible even when the API is healthy --
  # the two processes fail independently, so they are measured independently.
  - job_name: marketpulse-worker
    static_configs:
      - targets: ["worker:9101"]
        labels: {component: ingest}
